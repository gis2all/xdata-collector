name: Bug report
description: Report a reproducible defect in the local collector.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, command output, browser path, or failing test.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA.
